name: Github Actions demo
run-name: ${{ github.actor }} is testing out Github Actions
on: [push]
jobs: 
  Explore-Github-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Show workflow trigger
        run: echo "The workflow was triggered by a ${{ github.event_name }} event."
      - name: Show runner information
        run: echo "This job is running on a ${{ runner.os }} server hosted by GitHub."
      - name: Show branch and repository
        run: |
          echo "Branch: ${{ github.ref }}; repository: ${{ github.repository }}"
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Confirm checkout
        run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: Confirm workflow readiness
        run: echo "The workflow is ready to test the code on the runner."
      - name: List repository files
        run: ls "${{ github.workspace }}"
      - name: Show job status
        run: echo "This job's status is ${{ job.status }}."
